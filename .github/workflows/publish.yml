name: Build and Publish

on:
  # Manual trigger only - full control over when to publish
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match pyproject.toml, e.g. 2.0.0)'
        required: true
        type: string
      environment:
        description: 'Deploy to'
        required: true
        default: 'testpypi'
        type: choice
        options:
        - testpypi
        - pypi

permissions:
  contents: write
  id-token: write

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check that tests passed for the current commit
      run: |
        CURRENT_SHA="${{ github.sha }}"
        echo "Checking tests for commit: $CURRENT_SHA"
        for i in {1..60}; do
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               "https://api.github.com/repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$CURRENT_SHA&per_page=5" > test_runs.json
          run_count=$(jq '.total_count' test_runs.json)
          if [ "$run_count" -eq 0 ]; then
            echo "No test runs found yet, waiting... (attempt $i/60)"
            sleep 10
            continue
          fi
          status=$(jq -r '.workflow_runs[0].status' test_runs.json)
          conclusion=$(jq -r '.workflow_runs[0].conclusion' test_runs.json)
          echo "Test run status: $status, conclusion: $conclusion"
          if [ "$status" = "completed" ]; then
            if [ "$conclusion" = "success" ]; then
              echo "Tests passed for $CURRENT_SHA"
              exit 0
            fi
            echo "Tests did not pass for $CURRENT_SHA (conclusion: $conclusion)"
            exit 1
          fi
          sleep 10
        done
        echo "Timeout waiting for tests to complete"
        exit 1

  build:
    needs: check-tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # The version is the one COMMITTED in pyproject.toml - this job refuses
    # to publish if the input doesn't match, instead of sed-editing an
    # uncommitted version into the build like the old flow did.
    - name: Assert requested version matches pyproject.toml
      run: |
        PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        if [ "$PYPROJECT_VERSION" != "${{ github.event.inputs.version }}" ]; then
          echo "Requested ${{ github.event.inputs.version }} but pyproject.toml says $PYPROJECT_VERSION."
          echo "Bump pyproject.toml in a commit first, then re-run."
          exit 1
        fi

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: [check-tests, build]
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Determine target repository
      id: target
      run: |
        TARGET="${{ github.event.inputs.environment }}"
        if [[ "$TARGET" == "pypi" ]]; then
          echo "repository_url=" >> $GITHUB_OUTPUT
          echo "environment=Production PyPI" >> $GITHUB_OUTPUT
        else
          echo "repository_url=https://test.pypi.org/legacy/" >> $GITHUB_OUTPUT
          echo "environment=Test PyPI" >> $GITHUB_OUTPUT
        fi

    - name: Publish to ${{ steps.target.outputs.environment }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ steps.target.outputs.repository_url }}

  # Tag only AFTER a successful production publish, never before.
  tag:
    needs: publish
    if: ${{ github.event.inputs.environment == 'pypi' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Create release tag
      run: |
        TAG="v${{ github.event.inputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
          echo "Tag $TAG already exists, skipping"
        else
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        fi
