name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    # CPU wheels first: a bare `pip install torch` on Linux pulls multi-GB
    # CUDA wheels, which CI neither needs nor can use.
    - name: Install CPU-only torch
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Install package with test dependencies
      run: pip install -e .[test] flake8 mypy

    - name: Lint (syntax errors and undefined names)
      run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run test suite
      run: pytest tests/ -q

    - name: Build distribution
      run: python -m build

    - name: Type check (informational)
      run: mypy src/vcs
      continue-on-error: true
